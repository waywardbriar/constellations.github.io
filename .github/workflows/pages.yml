name: Build and publish the wiki
on:
  push:
    branches: [main]
    paths: ["source/**", "assets/**", "build_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc and parser
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          pip install beautifulsoup4
      - name: Build the site
        run: python3 build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
