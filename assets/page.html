<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · Constellations</title>
<link rel="stylesheet" href="assets/wiki.css">
</head>
<body class="{{BODYCLASS}}">
<script>try{if(localStorage.getItem("navOff")==="1")document.body.classList.add("nav-off")}catch(e){}</script>
<header class="top">
  <button class="menu" aria-label="Open menu" aria-expanded="false" aria-controls="side">Menu</button>
  <button class="navtoggle" aria-label="Hide or show the contents list" aria-pressed="true" title="Hide or show the contents list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><line x1="9" y1="4" x2="9" y2="20"/></svg></button>
  <a class="brand" href="index.html">Constellations</a>
  <div class="search">
    <label class="sr" for="q">Search the guide</label>
    <input id="q" type="search" placeholder="Search the guide" autocomplete="off">
    <div id="results" hidden></div>
  </div>
</header>
<div class="layout">
  <nav id="side" class="side" aria-label="Guide contents">
{{SIDEBAR}}
  </nav>
  <main class="main">
    <article class="doc">
      <h1>{{TITLE}}</h1>
{{BODY}}
    </article>
    <div class="pager">{{PREV}}{{NEXT}}</div>
    <footer class="sitefoot">© 2026 Olive Snail Productions · Licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" rel="license noopener" target="_blank">CC BY-NC-SA 4.0</a></footer>
  </main>
  <aside class="toc" aria-label="On this page">
    {{TOC}}
  </aside>
</div>
<script src="assets/wiki.js"></script>
</body>
</html>
